name: omni_flutter
description: AI-Powered Energy Management Platform

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Image Picker for Pet Psychic
  image_picker: ^1.0.7
  
  # Date/Time formatting
  intl: ^0.18.1
  
  # Local storage (for chat limits)
  shared_preferences: ^2.2.2
  
  # Icons
  cupertino_icons: ^1.0.6
  
  # AI Integration
  google_generative_ai: ^0.4.0
  
  # HTTP
  http: ^1.1.0

  # In-app purchases (subscriptions + consumable Jade Coins) on iOS/Android
  in_app_purchase: ^3.1.13

  # Opening Stripe Checkout on the web build
  url_launcher: ^6.2.4
  
  # Cyber-Taoist Stack
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  flutter_animate: ^4.3.0
  camera: ^0.10.5+5
  record: ^5.0.4
  permission_handler: ^11.0.1
  go_router: ^12.1.3
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Riverpod Code Generation
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.6
  custom_lint: ^0.5.0
  riverpod_lint: ^2.3.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
